<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Reality Vanish V9</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden}
.screen{position:fixed;inset:0}
#setup{background:#101010;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;gap:18px}
h1{font-size:27px;margin:0}.desc{opacity:.72;line-height:1.55;font-size:15px;max-width:420px}
.btn{border:0;border-radius:15px;padding:14px 20px;font-size:17px;font-weight:650;background:#fff;color:#000}
#pick{display:none}
#work,#show{display:none;background:#000;align-items:center;justify-content:center}
canvas{display:block;max-width:100vw;max-height:100vh;touch-action:none}
#tip{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.72);padding:9px 13px;border-radius:12px;font-size:14px;white-space:nowrap}
#ready{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);z-index:12;display:none}
#savePhoto{display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:30}
#secret{position:fixed;right:0;bottom:0;width:34vw;height:34vh;z-index:20;display:none;touch-action:none}
#exit{position:fixed;left:0;top:0;width:18vw;height:18vh;z-index:21;display:none}
</style></head>
<body>
<section id="setup" class="screen">
 <h1>Reality Vanish</h1>
 <div class="desc">V9 消失版：框住要消失的東西。框外請留一圈可用的背景。</div>
 <label class="btn">選擇照片<input id="pick" type="file" accept="image/*"></label>
</section>
<section id="work" class="screen"><canvas id="c"></canvas><div id="tip"></div><button id="ready" class="btn">進入表演模式</button></section>
<section id="show" class="screen"><canvas id="s"></canvas><button id="savePhoto" class="btn">儲存變化後照片</button><a id="dl" style="display:none"></a></section>
<div id="secret"></div><div id="exit"></div>
<script>
const $=q=>document.querySelector(q);
const setup=$('#setup'),work=$('#work'),show=$('#show'),pick=$('#pick'),c=$('#c'),s=$('#s');
const cx=c.getContext('2d',{willReadFrequently:true}),sx=s.getContext('2d',{willReadFrequently:true});
const tip=$('#tip'),ready=$('#ready'),secret=$('#secret'),exit=$('#exit'),savePhoto=$('#savePhoto'),dl=$('#dl');
let img=new Image(),start=null,box=null,selecting=false,base=null,changed=false;

function fit(iw,ih){let k=Math.min(1,1800/iw,1800/ih);c.width=Math.round(iw*k);c.height=Math.round(ih*k)}
function draw(){cx.clearRect(0,0,c.width,c.height);cx.drawImage(img,0,0,c.width,c.height)}
function pos(t){let r=c.getBoundingClientRect();return{x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height}}

pick.onchange=()=>{let f=pick.files?.[0];if(!f)return;let u=URL.createObjectURL(f);img.onload=()=>{fit(img.naturalWidth,img.naturalHeight);draw();setup.style.display='none';work.style.display='flex';tip.textContent='框住要消失的物品';URL.revokeObjectURL(u)};img.src=u};

c.addEventListener('touchstart',e=>{e.preventDefault();if(box)return;selecting=true;start=pos(e.touches[0])},{passive:false});
c.addEventListener('touchmove',e=>{if(!selecting)return;e.preventDefault();draw();let p=pos(e.touches[0]),x=Math.min(start.x,p.x),y=Math.min(start.y,p.y),w=Math.abs(start.x-p.x),h=Math.abs(start.y-p.y);cx.save();cx.strokeStyle='#fff';cx.lineWidth=Math.max(3,c.width/400);cx.setLineDash([12,9]);cx.strokeRect(x,y,w,h);cx.restore()},{passive:false});
c.addEventListener('touchend',e=>{if(!selecting)return;e.preventDefault();let p=pos(e.changedTouches[0]);box={x:Math.round(Math.min(start.x,p.x)),y:Math.round(Math.min(start.y,p.y)),w:Math.max(20,Math.round(Math.abs(start.x-p.x))),h:Math.max(20,Math.round(Math.abs(start.y-p.y)))};selecting=false;draw();base=cx.getImageData(0,0,c.width,c.height);tip.textContent='設定完成';ready.style.display='block'},{passive:false});

ready.onclick=()=>{s.width=c.width;s.height=c.height;sx.putImageData(base,0,0);work.style.display='none';show.style.display='flex';secret.style.display='block';exit.style.display='block'};

/* V9: fill the selected hole from four surrounding background strips.
   Every interior pixel receives a distance-weighted estimate from left/right/top/bottom.
   A second smoothing pass removes the four-way seam, then a feathered mask composites
   only the selected region back over the untouched original. */
function vanish(){
 if(changed||!box)return;changed=true;
 const W=s.width,H=s.height,x0=box.x,y0=box.y,w=box.w,h=box.h;
 const src=new Uint8ClampedArray(base.data);
 const out=new Uint8ClampedArray(base.data);
 const sample=Math.max(3,Math.round(Math.min(w,h)*0.08));
 function pix(x,y,ch){
   x=Math.max(0,Math.min(W-1,Math.round(x)));y=Math.max(0,Math.min(H-1,Math.round(y)));
   return src[(y*W+x)*4+ch];
 }
 for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
   let gx=x0+xx,gy=y0+yy;
   let u=(xx+.5)/w,v=(yy+.5)/h;
   let dlx=xx+1,drx=w-xx,dty=yy+1,dby=h-yy;
   let wl=1/(dlx*dlx),wr=1/(drx*drx),wt=1/(dty*dty),wb=1/(dby*dby);
   let sum=wl+wr+wt+wb;
   let i=(gy*W+gx)*4;
   for(let ch=0;ch<3;ch++){
     let L=0,R=0,T=0,B=0;
     for(let q=1;q<=sample;q++){
       L+=pix(x0-q,gy,ch); R+=pix(x0+w-1+q,gy,ch);
       T+=pix(gx,y0-q,ch); B+=pix(gx,y0+h-1+q,ch);
     }
     L/=sample;R/=sample;T/=sample;B/=sample;
     out[i+ch]=(L*wl+R*wr+T*wt+B*wb)/sum;
   }
   out[i+3]=255;
 }
 // Gentle local smoothing only inside the reconstructed area.
 let tmp=new Uint8ClampedArray(out);
 let rad=Math.max(2,Math.min(7,Math.round(Math.min(w,h)*0.018)));
 for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
   let gx=x0+xx,gy=y0+yy,i=(gy*W+gx)*4;
   for(let ch=0;ch<3;ch++){
     let total=0,ws=0;
     for(let dy=-rad;dy<=rad;dy+=rad)for(let dx=-rad;dx<=rad;dx+=rad){
       let nx=Math.max(x0,Math.min(x0+w-1,gx+dx)),ny=Math.max(y0,Math.min(y0+h-1,gy+dy));
       let weight=(dx===0&&dy===0)?4:1;total+=tmp[(ny*W+nx)*4+ch]*weight;ws+=weight;
     }
     out[i+ch]=total/ws;
   }
 }
 // Feather edge into untouched original so no rectangular boundary is visible.
 const feather=Math.max(8,Math.round(Math.min(w,h)*0.12));
 for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
   let gx=x0+xx,gy=y0+yy,i=(gy*W+gx)*4;
   let edge=Math.min(xx+1,w-xx,yy+1,h-yy);
   let a=Math.max(0,Math.min(1,edge/feather));a=a*a*(3-2*a);
   for(let ch=0;ch<3;ch++)out[i+ch]=src[i+ch]*(1-a)+out[i+ch]*a;
 }
 sx.putImageData(new ImageData(out,W,H),0,0);
 savePhoto.style.display='block';
}

savePhoto.onclick=()=>s.toBlob(b=>{if(!b)return;let u=URL.createObjectURL(b),w=window.open(u,'_blank');if(!w){dl.href=u;dl.download='Reality-Vanish.jpg';dl.click()}setTimeout(()=>URL.revokeObjectURL(u),60000)},'image/jpeg',.96);

let taps=0,timer,lastTouch=0;
function tap(e){if(e?.cancelable)e.preventDefault();let now=Date.now();if(e?.type==='click'&&now-lastTouch<500)return;if(e?.type==='touchend')lastTouch=now;taps++;clearTimeout(timer);if(taps>=3){taps=0;vanish()}else timer=setTimeout(()=>taps=0,1100)}
secret.addEventListener('touchend',tap,{passive:false});secret.addEventListener('click',tap);
let hold;exit.addEventListener('touchstart',()=>hold=setTimeout(()=>location.reload(),1400));exit.addEventListener('touchend',()=>clearTimeout(hold));exit.addEventListener('touchcancel',()=>clearTimeout(hold));
</script></body></html>
