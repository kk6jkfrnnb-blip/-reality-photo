<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Reality Photo V5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden}
.screen{position:fixed;inset:0}
#setup{background:#101010;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;gap:18px}
h1{font-size:27px;margin:0}.desc{opacity:.7;line-height:1.55;font-size:15px;max-width:420px}
.btn{border:0;border-radius:15px;padding:14px 20px;font-size:17px;font-weight:650;background:#fff;color:#000}
#pick{display:none}
#work,#show{display:none;background:#000;align-items:center;justify-content:center}
canvas{display:block;max-width:100vw;max-height:100vh;touch-action:none}
#tip{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.7);padding:9px 13px;border-radius:12px;font-size:14px;white-space:nowrap}
#ready{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);z-index:12;display:none}
#secret{position:fixed;right:0;bottom:0;width:32vw;height:32vh;z-index:20;display:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#exit{position:fixed;left:0;top:0;width:18vw;height:18vh;z-index:21;display:none}
</style>
</head>
<body>
<section id="setup" class="screen">
 <h1>Reality Photo</h1>
 <div class="desc">先用 iPhone 原生相機拍照，確認照片已經在「照片」App，再回來選取。設定完成後可進入乾淨的表演畫面。</div>
 <label class="btn">選擇照片<input id="pick" type="file" accept="image/*"></label>
</section>

<section id="work" class="screen">
 <canvas id="c"></canvas><div id="tip"></div>
 <button id="ready" class="btn">進入表演模式</button>
</section>

<section id="show" class="screen"><canvas id="s"></canvas></section>
<div id="diag" style="position:fixed;right:16px;top:calc(env(safe-area-inset-top) + 16px);z-index:50;
background:rgba(255,255,255,.92);color:#000;padding:8px 11px;border-radius:10px;
font:700 14px -apple-system;display:none;pointer-events:none">V5 READY</div>
<div id="secret"></div><div id="exit"></div>

<script>
const $=x=>document.querySelector(x);
const setup=$('#setup'),work=$('#work'),show=$('#show'),pick=$('#pick'),c=$('#c'),s=$('#s');
const ctx=c.getContext('2d'),sx=s.getContext('2d'),tip=$('#tip'),ready=$('#ready'),secret=$('#secret'),exit=$('#exit'),diag=$('#diag');
let img=new Image(), start, box, target, selecting=false, armed=false, changed=false, original;

function fitCanvas(canvas, iw, ih){
 const max=1800, k=Math.min(1,max/iw,max/ih);
 canvas.width=Math.round(iw*k);canvas.height=Math.round(ih*k);
}
function drawBase(){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height)}
function pt(canvas,t){let r=canvas.getBoundingClientRect();return{x:(t.clientX-r.left)*canvas.width/r.width,y:(t.clientY-r.top)*canvas.height/r.height}}

pick.onchange=()=>{
 let f=pick.files?.[0]; if(!f)return;
 let u=URL.createObjectURL(f);
 img.onload=()=>{
  fitCanvas(c,img.naturalWidth,img.naturalHeight);drawBase();
  setup.style.display='none';work.style.display='flex';
  tip.textContent='① 框住要移動的物件';
  URL.revokeObjectURL(u);
 };
 img.src=u;
};

c.addEventListener('touchstart',e=>{
 if(armed)return;e.preventDefault();
 if(!box){selecting=true;start=pt(c,e.touches[0]);}
 else{target=pt(c,e.touches[0]);armed=true;original=ctx.getImageData(0,0,c.width,c.height);tip.textContent='設定完成';ready.style.display='block';}
},{passive:false});

c.addEventListener('touchmove',e=>{
 if(!selecting||armed)return;e.preventDefault();drawBase();
 let p=pt(c,e.touches[0]),x=Math.min(start.x,p.x),y=Math.min(start.y,p.y),w=Math.abs(start.x-p.x),h=Math.abs(start.y-p.y);
 ctx.save();ctx.strokeStyle='white';ctx.lineWidth=Math.max(3,c.width/400);ctx.setLineDash([12,9]);ctx.strokeRect(x,y,w,h);ctx.restore();
},{passive:false});

c.addEventListener('touchend',e=>{
 if(!selecting||armed)return;e.preventDefault();
 let p=pt(c,e.changedTouches[0]);
 box={x:Math.round(Math.min(start.x,p.x)),y:Math.round(Math.min(start.y,p.y)),w:Math.max(3,Math.round(Math.abs(start.x-p.x))),h:Math.max(3,Math.round(Math.abs(start.y-p.y)))};
 selecting=false;drawBase();tip.textContent='② 點一下新的位置';
},{passive:false});

ready.onclick=()=>{
 fitCanvas(s,c.width,c.height); s.width=c.width;s.height=c.height;
 sx.drawImage(c,0,0);
 work.style.display='none';show.style.display='flex';secret.style.display='block';exit.style.display='block';diag.style.display='block';diag.textContent='V5 READY';
};

function magic(){
 if(!armed||changed)return;changed=true;
 let patch=document.createElement('canvas');patch.width=box.w;patch.height=box.h;
 patch.getContext('2d').drawImage(c,box.x,box.y,box.w,box.h,0,0,box.w,box.h);
 sx.putImageData(original,0,0);
 // simple background clone from adjacent region
 let donor=box.x-box.w-6>=0?box.x-box.w-6:Math.min(c.width-box.w,box.x+box.w+6);
 sx.drawImage(c,donor,box.y,box.w,box.h,box.x,box.y,box.w,box.h);
 sx.drawImage(patch,target.x-box.w/2,target.y-box.h/2);
}
let secretTaps=0, secretTapTimer=null, lastTouch=0;
function secretTap(e){
 if(e && e.cancelable) e.preventDefault();
 const now=Date.now();
 // Ignore synthetic click immediately following a touch.
 if(e && e.type==='click' && now-lastTouch<500) return;
 if(e && e.type==='touchend') lastTouch=now;
 secretTaps++;
 diag.style.display='block';
 diag.textContent='秘密點擊 '+secretTaps+'/3';
 clearTimeout(secretTapTimer);
 if(secretTaps>=3){
   secretTaps=0;
   diag.textContent='TRIGGERED ✓';
   // Obvious visual pulse proves the trigger fired.
   s.animate([{transform:'scale(1)'},{transform:'scale(.92)'},{transform:'scale(1)'}],
             {duration:420,easing:'ease-out'});
   setTimeout(magic,180);
 }else{
   secretTapTimer=setTimeout(()=>{
     secretTaps=0;
     diag.textContent='V5 READY';
   },1200);
 }
}
secret.addEventListener('touchend',secretTap,{passive:false});
secret.addEventListener('click',secretTap);

let exitHold;
exit.addEventListener('touchstart',()=>exitHold=setTimeout(()=>location.reload(),1400),{passive:true});
exit.addEventListener('touchend',()=>clearTimeout(exitHold),{passive:true});
</script>
</body></html>
