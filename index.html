<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Reality Photo V6</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden}
.screen{position:fixed;inset:0}
#setup{background:#101010;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;gap:18px}
h1{font-size:27px;margin:0}.desc{opacity:.72;line-height:1.55;font-size:15px;max-width:420px}
.btn{border:0;border-radius:15px;padding:14px 20px;font-size:17px;font-weight:650;background:#fff;color:#000}
#pick{display:none}
#work,#show{display:none;background:#000;align-items:center;justify-content:center}
canvas{display:block;max-width:100vw;max-height:100vh;touch-action:none}
#tip{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.72);padding:9px 13px;border-radius:12px;font-size:14px;white-space:nowrap}
#ready{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);z-index:12;display:none}
#secret{position:fixed;right:0;bottom:0;width:34vw;height:34vh;z-index:20;display:none;touch-action:none}
#exit{position:fixed;left:0;top:0;width:18vw;height:18vh;z-index:21;display:none}
</style>
</head>
<body>
<section id="setup" class="screen">
 <h1>Reality Photo</h1>
 <div class="desc">選擇照片後，框住要移動的物件，再點選新的位置。</div>
 <label class="btn">選擇照片<input id="pick" type="file" accept="image/*"></label>
</section>
<section id="work" class="screen">
 <canvas id="c"></canvas><div id="tip"></div>
 <button id="ready" class="btn">進入表演模式</button>
</section>
<section id="show" class="screen"><canvas id="s"></canvas></section>
<div id="secret"></div><div id="exit"></div>

<script>
const $=x=>document.querySelector(x);
const setup=$('#setup'),work=$('#work'),show=$('#show'),pick=$('#pick'),c=$('#c'),s=$('#s');
const ctx=c.getContext('2d',{willReadFrequently:true}), sx=s.getContext('2d',{willReadFrequently:true});
const tip=$('#tip'),ready=$('#ready'),secret=$('#secret'),exit=$('#exit');
let img=new Image(),start,box,target,selecting=false,armed=false,changed=false,baseImage=null;

function fitCanvas(canvas,iw,ih){
 const max=1800,k=Math.min(1,max/iw,max/ih);
 canvas.width=Math.round(iw*k);canvas.height=Math.round(ih*k);
}
function drawBase(){ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height)}
function pt(canvas,t){
 const r=canvas.getBoundingClientRect();
 return {x:(t.clientX-r.left)*canvas.width/r.width,y:(t.clientY-r.top)*canvas.height/r.height};
}
pick.onchange=()=>{
 const f=pick.files?.[0]; if(!f)return;
 const u=URL.createObjectURL(f);
 img.onload=()=>{
   fitCanvas(c,img.naturalWidth,img.naturalHeight);drawBase();
   setup.style.display='none';work.style.display='flex';
   tip.textContent='① 框住要移動的物件';
   URL.revokeObjectURL(u);
 };
 img.src=u;
};
c.addEventListener('touchstart',e=>{
 if(armed)return;e.preventDefault();
 if(!box){selecting=true;start=pt(c,e.touches[0]);}
 else{
   target=pt(c,e.touches[0]);armed=true;
   baseImage=ctx.getImageData(0,0,c.width,c.height);
   tip.textContent='設定完成';ready.style.display='block';
 }
},{passive:false});
c.addEventListener('touchmove',e=>{
 if(!selecting||armed)return;e.preventDefault();drawBase();
 const p=pt(c,e.touches[0]),x=Math.min(start.x,p.x),y=Math.min(start.y,p.y),w=Math.abs(start.x-p.x),h=Math.abs(start.y-p.y);
 ctx.save();ctx.strokeStyle='white';ctx.lineWidth=Math.max(3,c.width/400);ctx.setLineDash([12,9]);ctx.strokeRect(x,y,w,h);ctx.restore();
},{passive:false});
c.addEventListener('touchend',e=>{
 if(!selecting||armed)return;e.preventDefault();
 const p=pt(c,e.changedTouches[0]);
 box={x:Math.round(Math.min(start.x,p.x)),y:Math.round(Math.min(start.y,p.y)),w:Math.max(8,Math.round(Math.abs(start.x-p.x))),h:Math.max(8,Math.round(Math.abs(start.y-p.y)))};
 selecting=false;drawBase();tip.textContent='② 點一下新的位置';
},{passive:false});

ready.onclick=()=>{
 s.width=c.width;s.height=c.height;sx.putImageData(baseImage,0,0);
 work.style.display='none';show.style.display='flex';secret.style.display='block';exit.style.display='block';
};

function featheredPatch(sourceCanvas,x,y,w,h,feather){
 const out=document.createElement('canvas');out.width=w;out.height=h;
 const o=out.getContext('2d');
 o.drawImage(sourceCanvas,x,y,w,h,0,0,w,h);
 o.globalCompositeOperation='destination-in';
 const m=document.createElement('canvas');m.width=w;m.height=h;
 const mc=m.getContext('2d');
 const g=mc.createRadialGradient(w/2,h/2,Math.max(1,Math.min(w,h)*0.28),w/2,h/2,Math.max(w,h)*0.68);
 g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.72,'rgba(0,0,0,.98)');g.addColorStop(1,'rgba(0,0,0,0)');
 mc.fillStyle=g;mc.fillRect(0,0,w,h);
 o.drawImage(m,0,0);o.globalCompositeOperation='source-over';
 return out;
}

function healOriginal(){
 // Layer multiple surrounding samples with low opacity and feathering.
 // This is still heuristic, but removes the hard rectangular "sticker" edge.
 const pad=Math.max(8,Math.round(Math.min(box.w,box.h)*0.18));
 const bx=box.x,by=box.y,bw=box.w,bh=box.h;
 const samples=[
   [bx-bw-pad,by],[bx+bw+pad,by],[bx,by-bh-pad],[bx,by+bh+pad]
 ];
 sx.save();
 sx.beginPath();
 sx.ellipse(bx+bw/2,by+bh/2,bw*.58,bh*.58,0,0,Math.PI*2);
 sx.clip();
 let used=0;
 for(const [xx,yy] of samples){
   const sx0=Math.max(0,Math.min(c.width-bw,xx));
   const sy0=Math.max(0,Math.min(c.height-bh,yy));
   if(sx0>=0&&sy0>=0&&sx0+bw<=c.width&&sy0+bh<=c.height){
     sx.globalAlpha=0.25;
     sx.drawImage(c,sx0,sy0,bw,bh,bx,by,bw,bh);used++;
   }
 }
 sx.globalAlpha=1;
 sx.restore();
}

function magic(){
 if(!armed||changed)return;changed=true;
 sx.putImageData(baseImage,0,0);
 const patch=featheredPatch(c,box.x,box.y,box.w,box.h,Math.min(box.w,box.h)*.15);
 healOriginal();
 sx.drawImage(patch,target.x-box.w/2,target.y-box.h/2);
}

let taps=0,timer=null,lastTouch=0;
function secretTap(e){
 if(e&&e.cancelable)e.preventDefault();
 const now=Date.now();
 if(e&&e.type==='click'&&now-lastTouch<500)return;
 if(e&&e.type==='touchend')lastTouch=now;
 taps++;clearTimeout(timer);
 if(taps>=3){taps=0;magic();}
 else timer=setTimeout(()=>taps=0,1100);
}
secret.addEventListener('touchend',secretTap,{passive:false});
secret.addEventListener('click',secretTap);

let exitHold;
exit.addEventListener('touchstart',()=>exitHold=setTimeout(()=>location.reload(),1400),{passive:true});
exit.addEventListener('touchend',()=>clearTimeout(exitHold),{passive:true});
exit.addEventListener('touchcancel',()=>clearTimeout(exitHold),{passive:true});
</script>
</body></html>
